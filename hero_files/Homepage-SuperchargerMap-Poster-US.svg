<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f6f8"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#mapBg)" rx="8"/>

  <!-- Landmass outlines (North America, Europe, Asia, Australia, South America) -->
  <g fill="#d2d6df" stroke="#ffffff" stroke-width="1.5" opacity="0.85">
    <!-- North America -->
    <path d="M 150 120 Q 220 90, 320 100 T 420 180 T 380 320 T 280 350 T 200 300 T 120 220 Z" />
    <!-- South America -->
    <path d="M 320 360 Q 360 380, 370 450 T 340 540 T 300 480 T 300 400 Z" />
    <!-- Europe -->
    <path d="M 550 120 Q 640 100, 700 150 T 660 240 T 560 220 T 520 160 Z" />
    <!-- Africa -->
    <path d="M 560 250 Q 660 260, 680 350 T 630 480 T 560 420 T 540 320 Z" />
    <!-- Asia -->
    <path d="M 710 110 Q 880 90, 1020 160 T 1000 320 T 850 340 T 720 240 Z" />
    <!-- Australia -->
    <path d="M 940 380 Q 1020 370, 1050 430 T 990 500 T 920 450 Z" />
  </g>

  <!-- Major Grid / Route Lines connecting Supercharger hubs -->
  <g stroke="rgba(230, 0, 0, 0.25)" stroke-width="1.5" stroke-dasharray="4,4" fill="none">
    <path d="M 180 200 L 250 220 L 310 210 L 370 230 L 390 280 L 360 310" />
    <path d="M 250 220 L 280 260 L 340 270 L 370 230" />
    <path d="M 560 160 L 600 180 L 640 170 L 680 190" />
    <path d="M 760 220 L 820 230 L 900 240 L 960 260" />
  </g>

  <!-- Supercharger Pins (Red #FF3A3A) -->
  <g fill="#FF3A3A" stroke="#ffffff" stroke-width="1.5">
    <!-- US West Coast -->
    <circle cx="170" cy="190" r="6" filter="url(#glow)" />
    <circle cx="180" cy="210" r="7" filter="url(#glow)" />
    <circle cx="190" cy="240" r="6" filter="url(#glow)" />
    <circle cx="195" cy="265" r="7" filter="url(#glow)" />

    <!-- US Central & Texas -->
    <circle cx="250" cy="220" r="5" />
    <circle cx="280" cy="260" r="7" filter="url(#glow)" />
    <circle cx="300" cy="295" r="8" filter="url(#glow)" />
    <circle cx="315" cy="310" r="6" />

    <!-- US Midwest & East Coast -->
    <circle cx="320" cy="200" r="7" filter="url(#glow)" />
    <circle cx="350" cy="210" r="6" />
    <circle cx="375" cy="225" r="8" filter="url(#glow)" />
    <circle cx="385" cy="245" r="7" filter="url(#glow)" />
    <circle cx="370" cy="270" r="6" />
    <circle cx="380" cy="315" r="7" filter="url(#glow)" />

    <!-- Europe Hubs -->
    <circle cx="570" cy="170" r="6" filter="url(#glow)" />
    <circle cx="595" cy="165" r="7" filter="url(#glow)" />
    <circle cx="615" cy="180" r="6" />
    <circle cx="630" cy="195" r="5" />
    <circle cx="645" cy="175" r="6" filter="url(#glow)" />

    <!-- China & East Asia Hubs -->
    <circle cx="880" cy="220" r="7" filter="url(#glow)" />
    <circle cx="910" cy="240" r="8" filter="url(#glow)" />
    <circle cx="935" cy="250" r="7" filter="url(#glow)" />
    <circle cx="970" cy="230" r="6" filter="url(#glow)" />

    <!-- Australia -->
    <circle cx="990" cy="460" r="6" filter="url(#glow)" />
    <circle cx="1010" cy="440" r="5" />
  </g>

  <!-- Destination Charger Pins (Grey #8E8E93) -->
  <g fill="#8E8E93" stroke="#ffffff" stroke-width="1">
    <circle cx="175" cy="200" r="4" />
    <circle cx="200" cy="250" r="4" />
    <circle cx="260" cy="230" r="4" />
    <circle cx="290" cy="280" r="4" />
    <circle cx="340" cy="220" r="4" />
    <circle cx="365" cy="235" r="4" />
    <circle cx="580" cy="180" r="4" />
    <circle cx="605" cy="175" r="4" />
    <circle cx="895" cy="230" r="4" />
    <circle cx="925" cy="260" r="4" />
  </g>

  <!-- Pulse rings on high density hubs -->
  <circle cx="375" cy="225" r="16" fill="none" stroke="#FF3A3A" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="8;22;8" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="210" r="16" fill="none" stroke="#FF3A3A" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="8;22;8" dur="3s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="595" cy="165" r="16" fill="none" stroke="#FF3A3A" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="8;22;8" dur="3s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.5s" repeatCount="indefinite" />
  </circle>
</svg>